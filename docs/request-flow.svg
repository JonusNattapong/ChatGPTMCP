<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" width="920" height="860" role="img" aria-label="Lifecycle of one tool call: registry lookup, argument validation, path policy, preconditions, execution, then either a success envelope or a failure envelope whose code, hint, and details let the caller correct the call and retry.">
  <title>chatgpt-machine-mcp request lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg   { fill: #f8fafc; }
      .box  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #0f172a; }
      .h    { font-size: 13px; font-weight: 600; }
      .s    { font-size: 10.5px; fill: #475569; }
      .step { font-size: 11px; font-weight: 700; fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .fail { stroke: #dc2626; stroke-width: 1.3; marker-end: url(#arrowRed); stroke-dasharray: 5 3; }
      .errbox { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.4; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 10.5px; font-weight: 700; fill: #b91c1c; }
      .errs { font-size: 9.5px; fill: #7f1d1d; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="860"/>

  <text class="t" x="24" y="40" font-size="20" font-weight="700">Request lifecycle of one tool call</text>
  <text class="t s" x="24" y="62">Each gate fails closed with a stable code, and carries the hint and details the caller needs to fix the call without guessing.</text>

  <text class="t s" x="24" y="88" font-weight="600" fill="#475569">HAPPY PATH</text>
  <text class="t s" x="640" y="88" font-weight="600" fill="#b91c1c">FAILURE ENVELOPE · isError: true</text>

  <!-- 1 request -->
  <rect class="box" x="24" y="96" width="576" height="52" rx="10"/>
  <text class="t step" x="40" y="118">1</text>
  <text class="mono h" x="60" y="118">tools/call { name, arguments }</text>
  <text class="t s" x="60" y="136">arrives over stdio or Streamable HTTP</text>
  <line class="line" x1="312" y1="148" x2="312" y2="176"/>

  <!-- 2 registry -->
  <rect class="box" x="24" y="178" width="576" height="52" rx="10"/>
  <text class="t step" x="40" y="200">2</text>
  <text class="t h" x="60" y="200">registry lookup</text>
  <text class="t s" x="60" y="218">the name is resolved against the specs built by createToolSpecs</text>
  <line class="fail" x1="600" y1="204" x2="636" y2="204"/>
  <rect class="errbox" x="638" y="178" width="258" height="52" rx="10"/>
  <text class="code" x="652" y="199">UNKNOWN_TOOL</text>
  <text class="errs" x="652" y="216">details.available lists every real tool name</text>
  <line class="line" x1="312" y1="230" x2="312" y2="258"/>

  <!-- 3 arguments -->
  <rect class="box" x="24" y="260" width="576" height="52" rx="10"/>
  <text class="t step" x="40" y="282">3</text>
  <text class="t h" x="60" y="282">argument validation</text>
  <text class="t s" x="60" y="300">required strings, integers, arrays, and enums are checked before any work starts</text>
  <line class="fail" x1="600" y1="286" x2="636" y2="286"/>
  <rect class="errbox" x="638" y="260" width="258" height="52" rx="10"/>
  <text class="code" x="652" y="281">INVALID_ARGUMENT</text>
  <text class="errs" x="652" y="298">names the argument; nothing is coerced silently</text>
  <line class="line" x1="312" y1="312" x2="312" y2="340"/>

  <!-- 4 path policy -->
  <rect class="box" x="24" y="342" width="576" height="52" rx="10" stroke="#f59e0b"/>
  <text class="t step" x="40" y="364">4</text>
  <text class="t h" x="60" y="364" fill="#92400e">path policy</text>
  <text class="t s" x="60" y="382">resolveMachinePath resolves the path and its realpath against the access mode</text>
  <line class="fail" x1="600" y1="368" x2="636" y2="368"/>
  <rect class="errbox" x="638" y="342" width="258" height="52" rx="10"/>
  <text class="code" x="652" y="363">PATH_DENIED</text>
  <text class="errs" x="652" y="380">outside --root, symlink escape, or OS refusal</text>
  <line class="line" x1="312" y1="394" x2="312" y2="422"/>

  <!-- 5 preconditions -->
  <rect class="box" x="24" y="424" width="576" height="62" rx="10" stroke="#2563eb"/>
  <text class="t step" x="40" y="446">5</text>
  <text class="t h" x="60" y="446" fill="#1d4ed8">preconditions</text>
  <text class="t s" x="60" y="464">expected_sha256 compares the file digest; expected_replacements compares the</text>
  <text class="t s" x="60" y="479">occurrence count. Absent, an ambiguous edit is still refused.</text>
  <line class="fail" x1="600" y1="455" x2="636" y2="455"/>
  <rect class="errbox" x="638" y="424" width="258" height="62" rx="10"/>
  <text class="code" x="652" y="445">PRECONDITION_FAILED</text>
  <text class="errs" x="652" y="462">details.actualSha256 is the current digest</text>
  <text class="code" x="652" y="479" font-size="10">AMBIGUOUS_MATCH</text>
  <line class="line" x1="312" y1="486" x2="312" y2="514"/>

  <!-- 6 execute -->
  <rect class="box" x="24" y="516" width="576" height="72" rx="10"/>
  <text class="t step" x="40" y="538">6</text>
  <text class="t h" x="60" y="538">execute</text>
  <text class="t s" x="60" y="556">filesystem write · spawn a shell or background process · call git directly</text>
  <text class="t s" x="60" y="571">search runs ripgrep, and falls back to the built-in scanner when rg is absent</text>
  <line class="fail" x1="600" y1="552" x2="636" y2="552"/>
  <rect class="errbox" x="638" y="516" width="258" height="72" rx="10"/>
  <text class="code" x="652" y="537">NO_MATCH</text>
  <text class="errs" x="652" y="553">details.nearMisses: candidate lines ignoring whitespace</text>
  <text class="code" x="652" y="571">TIMEOUT · DEPENDENCY_MISSING · NETWORK</text>
  <line class="line" x1="312" y1="588" x2="312" y2="616"/>

  <!-- 7 outcomes -->
  <rect x="24" y="618" width="576" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text class="t step" x="40" y="640">7</text>
  <text class="t h" x="60" y="640" fill="#065f46">success envelope</text>
  <text class="mono" x="60" y="659" font-size="10.5" fill="#065f46">{ "ok": true, "path": "...", "sha256": "9f2c...", "totalLines": 42 }</text>
  <text class="t s" x="60" y="678" fill="#065f46">write, edit, and update return the new digest, which becomes the next expected_sha256</text>

  <rect class="errbox" x="638" y="618" width="258" height="76" rx="10"/>
  <text class="t h" x="652" y="640" fill="#b91c1c">failure envelope</text>
  <text class="mono" x="652" y="658" font-size="9.5" fill="#7f1d1d">{ "ok": false, "tool": ..., "error": {</text>
  <text class="mono" x="652" y="672" font-size="9.5" fill="#7f1d1d">  code, message, hint, details } }</text>
  <text class="errs" x="652" y="688">the MCP result also sets isError</text>

  <!-- retry loop -->
  <path d="M 896 694 L 908 694 L 908 736 L 312 736 L 312 758" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <rect x="24" y="760" width="872" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="40" y="782">self-correction loop</text>
  <text class="t s" x="40" y="800">PRECONDITION_FAILED returns the current digest, so the caller re-reads the file and rebuilds the edit against it.</text>
  <text class="t s" x="40" y="816">NO_MATCH returns near misses, so an indentation mistake is fixed in one step instead of by retrying blindly.</text>
  <path d="M 24 796 L 12 796 L 12 122 L 24 122" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
