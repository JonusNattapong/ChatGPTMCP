name: Auto Changelog & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  changelog:
    name: Auto Changelog & Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate / Update CHANGELOG.md
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          node scripts/update-changelog.mjs "$VERSION"

      - name: Commit Updated Changelog (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s CHANGELOG.md) ]]; then
            git add CHANGELOG.md
            git commit -m "chore(changelog): auto-update CHANGELOG.md [skip ci]"
            git push origin main
          else
            echo "No changes to CHANGELOG.md"
          fi

      - name: Create GitHub Release (on tag or manual version)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == "main" ]]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
          fi
          echo "Publishing release for $TAG_NAME..."
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            CHANGELOG.md
